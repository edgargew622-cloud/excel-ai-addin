name: Commercial C1 integration
on:
  push:
    branches: [codex/commercial-c1]
  pull_request:
    paths:
      - "server/**"
      - "compose.commercial.yml"
      - ".github/workflows/commercial-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: amai_c1
          POSTGRES_PASSWORD: c1-local-test-only
          POSTGRES_DB: amai_c1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amai_c1 -d amai_c1_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      COMMERCIAL_TEST_DATABASE_URL: postgresql://amai_c1:c1-local-test-only@127.0.0.1:5432/amai_c1_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix server test
      - run: npm --prefix server run test:commercial
