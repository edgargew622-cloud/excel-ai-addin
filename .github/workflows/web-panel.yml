# Веб-панель для Excel на Mac и в браузере (panelMode.ts): сборка без
# локального сервера и публикация на GitHub Pages. Манифест для установки —
# на том же сайте: <сайт>/manifest.xml. Секретов в сборке нет: ключ
# OpenRouter пользователь вводит в самой панели.
name: Веб-панель (GitHub Pages)

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка веб-панели
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Сборка
        env:
          WEB_PANEL_BASE: ${{ steps.pages.outputs.base_url }}/
        run: npm run build:web
      - name: Проверка сборки
        run: |
          test -f dist-web/taskpane.html && test -f dist-web/manifest.xml && test -f dist-web/assets/amai-32.png
          ! grep -rl "localhost:3000" dist-web/manifest.xml
          # Ключей и токенов в сборке быть не может — проверяем всё равно.
          ! grep -rlE "sk-[A-Za-z0-9]{20,}|sk-or-v1-[a-f0-9]{20,}|tvly-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}" dist-web
          grep -o "<SourceLocation[^>]*>" dist-web/manifest.xml | head -1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
