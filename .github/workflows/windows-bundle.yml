# Готовый комплект для Windows: тесты, сборка, комплект со своим Node,
# проверка комплекта в настоящей Windows. На тег v* — выпуск на GitHub
# с zip-архивом комплекта.

name: Комплект для Windows

on:
  push:
    branches: [production]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Сборка и проверка
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Зависимости
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund

      - name: Тесты и сборка
        run: npm run check

      - name: Комплект
        run: node scripts/bundle.mjs --out bundle

      # На раннере есть права администратора: сертификат ставится для всей
      # машины, без окна подтверждения, которое вызвала бы установка для
      # текущего пользователя.
      - name: Сертификат localhost для проверки
        run: node bundle/ExcelAI/server/node_modules/office-addin-dev-certs/lib/cli.js install --machine

      - name: Проверка комплекта
        shell: pwsh
        run: ./scripts/bundle-smoke.ps1 -BundleRoot bundle/ExcelAI

      - name: Архив
        shell: pwsh
        run: |
          $info = Get-Content bundle/ExcelAI/bundle.json -Raw | ConvertFrom-Json
          $name = "ExcelAI-$($info.version)-$($info.release)-win-x64.zip"
          Compress-Archive -Path bundle/ExcelAI -DestinationPath "bundle/$name"
          # Имя с кириллицей должно дойти до архива как есть: по нему пользователь
          # находит установку.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "bundle/$name"))
          $entries = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          $zip.Dispose()
          if ($entries -notcontains 'ExcelAI/Установить.cmd') { throw "В архиве нет ExcelAI/Установить.cmd: $($entries | Select-Object -First 5)" }
          $secrets = $entries | Where-Object { $_ -match '(^|/)(\.env|keys\.dpapi[^/]*|panel-token)$' -or $_ -match '/logs/' }
          if ($secrets) { throw "В архиве лишнее — ключи, токен или журналы: $($secrets -join ', ')" }
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Setup.exe (8.8.4): Inno Setup, установка в личную папку без прав
      # администратора. Проверяется до установки из архива — на чистой машине.
      - name: Установщик Setup.exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $info = Get-Content bundle/ExcelAI/bundle.json -Raw | ConvertFrom-Json
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$($info.version)" "/DSourceDir=$PWD\bundle\ExcelAI" "/DOutputDir=$PWD\bundle" packaging\ExcelAI.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }
          "SETUP_NAME=ExcelAI-Setup-$($info.version).exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Проверка Setup.exe — установка и удаление
        shell: powershell
        run: |
          $setup = Join-Path $PWD "bundle\$env:SETUP_NAME"
          $app = Join-Path $env:LOCALAPPDATA 'Programs\ExcelAI'
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          if (Test-Path "$app\install.log") { Get-Content "$app\install.log" }
          $health = Invoke-RestMethod -Uri https://localhost:3000/api/health -TimeoutSec 10
          $release = (Get-Content "$app\releases\current.json" -Raw | ConvertFrom-Json).id
          if ($health.release -ne $release) { throw "Сервер отвечает выпуском $($health.release), ожидался $release" }
          $manifest = (Get-ItemProperty 'HKCU:\Software\Microsoft\Office\16.0\WEF\Developer').'5f2c9a41-1f7c-4f2b-9a0e-9c1f2d7b3e10'
          if ($manifest -ne "$app\catalog\manifest.xml" -or -not (Select-String -LiteralPath $manifest -Pattern 'taskpane.html\?t=' -Quiet)) { throw "Регистрация в Excel не та: $manifest" }
          Write-Output "Установлено: $app, выпуск $release, регистрация $manifest"
          Start-Process -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 5
          $left = @()
          if (Get-ScheduledTask -TaskName ExcelAiAddinServer -ErrorAction SilentlyContinue) { $left += 'задача автозапуска' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Office\16.0\WEF\Developer' -ErrorAction SilentlyContinue).'5f2c9a41-1f7c-4f2b-9a0e-9c1f2d7b3e10') { $left += 'регистрация в Excel' }
          if (Test-Path $app) { $left += "папка $app" }
          if (Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue) { $left += 'сервер на порту 3000' }
          if ($left) { throw "После удаления осталось: $($left -join ', ')" }
          Write-Output 'Удаление чистое: задачи, регистрации, папки и сервера нет.'

      # После архива: установка оставляет в папке журналы и каталог, в zip
      # им не место. Раннер — чистая Windows: так проверяется установка
      # пользователя от распаковки до зарегистрированной надстройки.
      - name: Установка из архива на чистой машине
        shell: powershell
        run: |
          ./bundle/ExcelAI/scripts/install.ps1 -SkipCertificate
          $manifest = (Get-ItemProperty 'HKCU:\Software\Microsoft\Office\16.0\WEF\Developer').'5f2c9a41-1f7c-4f2b-9a0e-9c1f2d7b3e10'
          if (-not $manifest -or -not (Select-String -LiteralPath $manifest -Pattern 'taskpane.html\?t=' -Quiet)) { throw "Надстройка не зарегистрирована или без токена: $manifest" }
          Write-Output "Надстройка зарегистрирована: $manifest"

      - uses: actions/upload-artifact@v4
        with:
          name: excel-ai-win-x64
          path: |
            bundle/${{ env.ZIP_NAME }}
            bundle/${{ env.SETUP_NAME }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Выпуск на GitHub
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: excel-ai-win-x64
          path: out

      - name: Создать выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.exe out/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
