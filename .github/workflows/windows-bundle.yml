# Готовый комплект для Windows: тесты, сборка, комплект со своим Node,
# проверка комплекта в настоящей Windows. На тег v* — выпуск на GitHub
# с zip-архивом комплекта.

name: Комплект для Windows

on:
  push:
    branches: [production]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Сборка и проверка
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Зависимости
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund

      - name: Тесты и сборка
        run: npm run check

      - name: Комплект
        run: node scripts/bundle.mjs --out bundle

      # На раннере есть права администратора: сертификат ставится для всей
      # машины, без окна подтверждения, которое вызвала бы установка для
      # текущего пользователя.
      - name: Сертификат localhost для проверки
        run: node bundle/ExcelAI/server/node_modules/office-addin-dev-certs/lib/cli.js install --machine --days 365

      - name: Проверка комплекта
        shell: pwsh
        run: ./scripts/bundle-smoke.ps1 -BundleRoot bundle/ExcelAI

      - name: Архив
        shell: pwsh
        run: |
          $info = Get-Content bundle/ExcelAI/bundle.json -Raw | ConvertFrom-Json
          $name = "ExcelAI-$($info.version)-$($info.release)-win-x64.zip"
          Compress-Archive -Path bundle/ExcelAI -DestinationPath "bundle/$name"
          # Имя с кириллицей должно дойти до архива как есть: по нему пользователь
          # находит установку.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "bundle/$name"))
          $entries = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          $zip.Dispose()
          if ($entries -notcontains 'ExcelAI/Установить.cmd') { throw "В архиве нет ExcelAI/Установить.cmd: $($entries | Select-Object -First 5)" }
          $secrets = $entries | Where-Object { $_ -match '(^|/)(\.env|keys\.dpapi[^/]*|panel-token|memory\.json[^/]*)$' -or $_ -match '/logs/' }
          if ($secrets) { throw "В архиве лишнее — ключи, токен или журналы: $($secrets -join ', ')" }
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Setup.exe (8.8.4): Inno Setup, установка в личную папку без прав
      # администратора. Проверяется до установки из архива — на чистой машине.
      - name: Установщик Setup.exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $info = Get-Content bundle/ExcelAI/bundle.json -Raw | ConvertFrom-Json
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$($info.version)" "/DSourceDir=$PWD\bundle\ExcelAI" "/DOutputDir=$PWD\bundle" packaging\ExcelAI.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }
          "SETUP_NAME=ExcelAI-Setup-$($info.version).exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Проверка Setup.exe — установка и удаление
        shell: pwsh
        timeout-minutes: 8
        run: |
          # Регистрация в Excel: общая папка \\localhost\C$\… (основной способ) или
          # или она же через WebDAV \\localhost@3080\catalog (без прав администратора), или
          # запасная запись «для разработчика». Возвращает путь, по которому Excel читает манифест.
          function Get-AddinRegistration {
            $wef = 'HKCU:\Software\Microsoft\Office\16.0\WEF'
            $url = (Get-ItemProperty "$wef\TrustedCatalogs\{7c7d2ddc-9f41-4d6c-a675-e073e604d789}" -ErrorAction SilentlyContinue).Url
            if ($url -match '^\\\\localhost\\([A-Za-z])\$\\(.*)$') { Write-Output "общая папка: $url" | Out-Host; return "$($Matches[1]):\$($Matches[2])\manifest.xml" }
            if ($url -match '^\\\\localhost@\d+\\catalog$') { Write-Output "общая папка через WebDAV: $url" | Out-Host; return "$url\manifest.xml" }
            $dev = (Get-ItemProperty "$wef\Developer" -ErrorAction SilentlyContinue).'5f2c9a41-1f7c-4f2b-9a0e-9c1f2d7b3e10'
            if ($dev) { Write-Output "запись для разработчика: $dev" | Out-Host }
            return $dev
          }
          $setup = Join-Path $PWD "bundle\$env:SETUP_NAME"
          $app = Join-Path $env:LOCALAPPDATA 'Programs\ExcelAI'
          # Ждём только сам Setup: Start-Process -Wait в PowerShell 7 ждёт и все его
          # дочерние процессы, а установка запускает сервер, который работает всегда.
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/skipcert=1', "/LOG=$log" -PassThru
          $finished = $proc.WaitForExit(300000)
          Write-Output '--- журнал Setup (хвост):'; if (Test-Path $log) { Get-Content $log -Tail 40 }
          Write-Output '--- install.log:'; if (Test-Path "$app\install.log") { Get-Content "$app\install.log" }
          if (-not $finished) {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'powershell|node|ExcelAI|cmd' } | ForEach-Object { "$($_.ProcessId) $($_.Name) $($_.CommandLine)" }
            throw 'Setup.exe не завершился за 5 минут'
          }
          Write-Output "Setup завершился с кодом $($proc.ExitCode)"
          $health = Invoke-RestMethod -Uri https://localhost:3000/api/health -TimeoutSec 10
          $release = (Get-Content "$app\releases\current.json" -Raw | ConvertFrom-Json).id
          if ($health.release -ne $release) { throw "Сервер отвечает выпуском $($health.release), ожидался $release" }
          $manifest = Get-AddinRegistration
          if ($manifest -ne "$app\catalog\manifest.xml" -or -not (Select-String -LiteralPath $manifest -Pattern 'taskpane.html\?t=' -Quiet)) { throw "Регистрация в Excel не та: $manifest" }
          Write-Output "Установлено: $app, выпуск $release, регистрация $manifest"
          # Регистрация через C$ — каталог по WebDAV (catalogDav.ts) закрыт: манифест
          # с токеном другим учётным записям этого компьютера не виден.
          $closed = & curl.exe -s -o NUL -w '%{http_code}' -H 'Host: localhost:3080' http://127.0.0.1:3080/catalog/manifest.xml
          if ($closed -ne '404') { throw "При регистрации через C$ WebDAV-каталог открыт: $closed" }
          Write-Output 'WebDAV-каталог закрыт: регистрация через C$.'
          $un = Start-Process -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $un.WaitForExit(180000)) { throw 'Удаление не завершилось за 3 минуты' }
          Start-Sleep -Seconds 5
          $left = @()
          if (Get-ScheduledTask -TaskName ExcelAiAddinServer -ErrorAction SilentlyContinue) { $left += 'задача автозапуска' }
          if (Get-AddinRegistration) { $left += 'регистрация в Excel' }
          if (Test-Path $app) { $left += "папка $app" }
          if (Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue) { $left += 'сервер на порту 3000' }
          if (Get-NetTCPConnection -LocalPort 3080 -State Listen -ErrorAction SilentlyContinue) { $left += 'каталог WebDAV на порту 3080' }
          if ($left) { throw "После удаления осталось: $($left -join ', ')" }
          Write-Output 'Удаление чистое: задачи, регистрации, папки и сервера нет.'

      # После архива: установка оставляет в папке журналы и каталог, в zip
      # им не место. Раннер — чистая Windows: так проверяется установка
      # пользователя от распаковки до зарегистрированной надстройки.
      - name: Установка из архива на чистой машине
        shell: pwsh
        timeout-minutes: 8
        run: |
          # Регистрация в Excel: общая папка \\localhost\C$\… (основной способ) или
          # или она же через WebDAV \\localhost@3080\catalog (без прав администратора), или
          # запасная запись «для разработчика». Возвращает путь, по которому Excel читает манифест.
          function Get-AddinRegistration {
            $wef = 'HKCU:\Software\Microsoft\Office\16.0\WEF'
            $url = (Get-ItemProperty "$wef\TrustedCatalogs\{7c7d2ddc-9f41-4d6c-a675-e073e604d789}" -ErrorAction SilentlyContinue).Url
            if ($url -match '^\\\\localhost\\([A-Za-z])\$\\(.*)$') { Write-Output "общая папка: $url" | Out-Host; return "$($Matches[1]):\$($Matches[2])\manifest.xml" }
            if ($url -match '^\\\\localhost@\d+\\catalog$') { Write-Output "общая папка через WebDAV: $url" | Out-Host; return "$url\manifest.xml" }
            $dev = (Get-ItemProperty "$wef\Developer" -ErrorAction SilentlyContinue).'5f2c9a41-1f7c-4f2b-9a0e-9c1f2d7b3e10'
            if ($dev) { Write-Output "запись для разработчика: $dev" | Out-Host }
            return $dev
          }
          ./bundle/ExcelAI/scripts/install.ps1 -SkipCertificate
          $manifest = Get-AddinRegistration
          if (-not $manifest -or -not (Select-String -LiteralPath $manifest -Pattern 'taskpane.html\?t=' -Quiet)) { throw "Надстройка не зарегистрирована или без токена: $manifest" }
          Write-Output "Надстройка зарегистрирована: $manifest"
          # Путь без прав администратора: каталог по WebDAV (catalogDav.ts). С меткой
          # регистрации — свой адрес получает манифест, чужой (подмена DNS) — отказ.
          # curl.exe: заголовок Host подменяется надёжно в любой версии PowerShell.
          $marker = './bundle/ExcelAI/server/catalog-dav'
          Set-Content -LiteralPath $marker -Value 'проверка CI'
          $dav = (& curl.exe -s -H 'Host: localhost:3080' http://127.0.0.1:3080/catalog/manifest.xml) -join "`n"
          if ($dav -notmatch 'taskpane.html\?t=') { throw 'WebDAV-каталог с меткой отдал не тот манифест' }
          $foreign = & curl.exe -s -o NUL -w '%{http_code}' -H 'Host: evil.example:3080' http://127.0.0.1:3080/catalog/manifest.xml
          if ($foreign -ne '403') { throw "WebDAV-каталог ответил чужому адресу: $foreign" }
          Write-Output 'WebDAV-каталог: манифест своим, 403 чужим.'
          # Сама регистрация через WebDAV — если есть служба WebClient (на Windows
          # Server её обычно нет или она выключена; тогда только сообщаем).
          if ((Get-Service WebClient -ErrorAction SilentlyContinue) -and (Test-Path -LiteralPath '\\localhost@3080\catalog\manifest.xml' -ErrorAction SilentlyContinue)) {
            ./bundle/ExcelAI/scripts/register-addin.ps1 -SkipAdminShare
            $manifest = Get-AddinRegistration
            if ($manifest -notmatch '^\\\\localhost@3080\\catalog\\manifest\.xml$' -or -not (Select-String -LiteralPath $manifest -Pattern 'taskpane.html\?t=' -Quiet)) { throw "Без C$ надстройка не зарегистрирована через WebDAV: $manifest" }
            Write-Output 'Регистрация без прав администратора (WebDAV) проверена.'
          } else {
            Remove-Item -LiteralPath $marker -Force
            Write-Output 'Служба WebClient здесь недоступна — путь WebDAV проверен только запросами к серверу.'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: excel-ai-win-x64
          path: |
            bundle/${{ env.ZIP_NAME }}
            bundle/${{ env.SETUP_NAME }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Выпуск на GitHub
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: excel-ai-win-x64
          path: out

      - name: Создать выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        # Сверху — как установить: Windows — установщик из этого выпуска, Mac —
        # одна команда со страницы сайта (mac.html); ниже — список изменений GitHub.
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          cat > notes.md <<EOF
          ## Как установить

          **Windows** — скачайте \`ExcelAI-Setup-${GITHUB_REF_NAME#v}.exe\` ниже, закройте Excel и запустите. Права администратора не нужны.

          **Mac** — одна команда в Терминале: ${site}mac.html

          **Excel в браузере** — «Надстройки» → «Мои надстройки» → «Отправить мою надстройку» → [manifest.xml](${site}manifest.xml).
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" out/*.exe out/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
